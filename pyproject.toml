[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tantivy2agents"
version = "0.3.0"
description = "Tantivy-based document indexing agent for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["tantivy", "search", "indexing", "claude", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "PyYAML>=6.0",
    "tantivy>=0.24.0",
    "charset-normalizer>=3.3.0",
]

[project.scripts]
tantivy2agents = "tantivy2agents.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tantivy2agents"]

[tool.hatch.build.targets.sdist]
include = ["src/tantivy2agents"]
