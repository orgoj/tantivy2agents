[tools]
gitleaks = "latest"
claude = "latest"
pre-commit = "latest"
python = "3.13"
sops = "latest"
yq = "4.47.2"

[env]
# Install seed packages (pip, setuptools, and wheel) into the virtual environment.
_.python.venv = { path = ".venv", create = true, uv_create_args = ['--seed'] }

[tasks.install]
run = """
uv sync --extra dev
pre-commit install
"""

[tasks.reinstall-venv]
description = "Reinstall the virtual environment"
run = """
#!/bin/bash -x
rm -rf .venv
mise install -q
mise run install
"""

[tasks.test]
run = "uv run python run_tests.py"

[tasks.pre-commit]
description = "Run pre-commit on all files"
run = "pre-commit run --all-files"

[tasks.bump]
description = "Bump version in pyproject.toml and __init__.py (patch|minor|major|X.Y.Z)"
run = "uv run python scripts/bump_version.py"

[tasks.install-user]
description = "Install/update current version for user (stable, non-editable)"
run = "uv tool install --reinstall --force ."
